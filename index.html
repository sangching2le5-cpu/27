<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12305c">
<title>Unit 27 · Could (do) and could have (done) — Interactive Grammar App</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy:#12305c; --navy2:#1d4478; --blue:#3a72ad; --blue-l:#7fb3e0;
  --pastel:#dce9f8; --pastel2:#eef5fd; --bg:#f0f6fc;
  --card:#ffffff; --line:#d5e3f2; --ink:#172e4d; --muted:#5c7691;
  --ok:#1a7f56; --okbg:#e3f6ec; --okline:#b9e3cd;
  --bad:#c0392b; --badbg:#fdecea; --badline:#f3c2bc;
  --amber:#a06a00; --amberbg:#fff8e6; --amberline:#e8c76a;
  --shadow:0 2px 10px rgba(18,48,92,.06);
  --shadow-lg:0 8px 30px rgba(18,48,92,.12);
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button{font-family:inherit}
a{color:var(--blue);text-decoration:none}

/* ============ HEADER ============ */
.app-header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,#12305c 0%,#255a97 100%);
  color:#fff;
  box-shadow:0 2px 14px rgba(18,48,92,.22);
}
.header-inner{
  max-width:1080px;margin:0 auto;
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.unit-badge{
  font-size:10.5px;font-weight:800;letter-spacing:.14em;
  background:rgba(255,255,255,.18);padding:4px 9px;border-radius:6px;
  flex:0 0 auto;
}
.app-title{
  font-size:14.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-progress{
  font-size:12px;font-weight:700;
  background:rgba(255,255,255,.16);
  padding:5px 12px;border-radius:999px;
  flex:0 0 auto;white-space:nowrap;
}
.header-progress b{font-size:13px}
.header-bar{height:3px;background:rgba(255,255,255,.15)}
.header-bar > div{height:100%;background:#7fb3e0;width:0;transition:width .35s ease}

/* ============ NAV ============ */
.main-nav{
  position:sticky;top:56px;z-index:35;
  background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(18,48,92,.04);
}
.nav-inner{
  max-width:1080px;margin:0 auto;
  display:flex;gap:4px;
  padding:6px 10px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.nav-inner::-webkit-scrollbar{display:none}
.nav-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  border:1px solid transparent;
  background:transparent;color:var(--muted);
  font-size:13.5px;font-weight:600;
  white-space:nowrap;cursor:pointer;
  transition:.15s;
}
.nav-btn:hover{background:var(--pastel2);color:var(--navy)}
.nav-btn.active{background:var(--navy);color:#fff}
.nav-btn .nav-icon{font-size:15px;line-height:1}

/* ============ MAIN ============ */
main{
  max-width:1080px;margin:0 auto;
  padding:16px 14px 60px;
}
.screen-title{
  font-size:22px;font-weight:800;color:var(--navy);
  margin:4px 0 4px;line-height:1.25;
}
.screen-sub{
  font-size:14px;color:var(--muted);
  margin:0 0 18px;line-height:1.5;
}

/* ============ CARDS ============ */
.card{
  background:var(--card);border-radius:14px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:16px 18px;
  margin-bottom:14px;
}
.card.tight{padding:12px 14px}
.card.flat{box-shadow:none}
.card h2{
  font-size:17px;font-weight:800;color:var(--navy);
  margin:0 0 10px;line-height:1.3;
}
.card h3{
  font-size:14.5px;font-weight:800;color:var(--blue);
  margin:14px 0 6px;
  text-transform:uppercase;letter-spacing:.04em;
}
.card p{margin:8px 0;line-height:1.65}
.card ul,.card ol{margin:8px 0;padding-left:22px}
.card li{margin:6px 0;line-height:1.6}

/* ============ HOME ============ */
.home-hero{
  background:linear-gradient(135deg,#e8f1fc 0%,#d4e6fa 100%);
  border-radius:16px;padding:22px 20px;
  border:1px solid #c8ddf3;
  margin-bottom:18px;
}
.home-hero .eyebrow{
  font-size:11.5px;font-weight:800;letter-spacing:.14em;
  color:var(--blue);text-transform:uppercase;margin:0 0 6px;
}
.home-hero h1{
  font-size:26px;font-weight:800;color:var(--navy);
  margin:0 0 6px;line-height:1.2;
}
.home-hero h2{
  font-size:15px;font-weight:600;color:var(--blue);
  margin:0 0 12px;
}
.home-hero p{margin:8px 0;font-size:14.5px;color:#37506e;line-height:1.6}

.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
.tile{
  display:flex;flex-direction:column;gap:6px;
  padding:16px;border-radius:14px;
  background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow);
  cursor:pointer;transition:.15s;
  text-align:left;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blue-l)}
.tile .tile-icon{
  font-size:24px;line-height:1;
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:11px;background:var(--pastel);
  margin-bottom:6px;
}
.tile .tile-title{
  font-size:15.5px;font-weight:800;color:var(--navy);
  line-height:1.3;
}
.tile .tile-desc{
  font-size:13px;color:var(--muted);
  line-height:1.5;margin:0;
}
.tile .tile-badge{
  font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:999px;
  background:var(--pastel);color:var(--blue);
  align-self:flex-start;margin-top:4px;
}

/* ============ LESSON ============ */
.subnav{
  display:flex;gap:6px;flex-wrap:wrap;
  margin-bottom:14px;
}
.subnav-btn{
  padding:7px 14px;border-radius:999px;
  border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;color:var(--navy);
  cursor:pointer;transition:.15s;
}
.subnav-btn:hover{background:var(--pastel2);border-color:var(--blue-l)}
.subnav-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.subnav-btn.done::after{
  content:"✓";margin-left:6px;color:var(--ok);font-weight:800;
}
.subnav-btn.active.done::after{color:#a9e8c9}

.source-box{
  background:var(--pastel2);
  border-left:5px solid var(--blue-l);
  border-radius:10px;
  padding:14px 18px;
  margin:10px 0;
}
.source-box p{margin:8px 0;font-size:15.5px;line-height:1.7}
.source-box ul{margin:8px 0;padding-left:22px}
.source-box li{margin:6px 0;line-height:1.6}
.source-box .ex{font-weight:600;color:var(--navy)}
.source-box .vi-ex{color:var(--muted);font-size:13.5px;font-style:italic;margin-top:2px;display:block}

details.vn{
  margin:10px 0;border:1px solid var(--line);
  border-radius:10px;background:#fff;overflow:hidden;
}
details.vn > summary{
  cursor:pointer;padding:11px 16px;
  font-weight:700;color:var(--navy);
  background:var(--pastel);list-style:none;
  font-size:13.5px;user-select:none;
  display:flex;align-items:center;gap:8px;
}
details.vn > summary::-webkit-details-marker{display:none}
details.vn > summary .label{
  background:var(--navy);color:#fff;font-size:10.5px;
  padding:2px 8px;border-radius:999px;font-weight:800;
  letter-spacing:.05em;
}
details.vn > summary::after{
  content:"+";margin-left:auto;font-weight:800;
  font-size:18px;color:var(--blue);transition:.2s;
}
details.vn[open] > summary::after{content:"−"}
details.vn .vn-body{
  padding:12px 16px;font-size:14.5px;line-height:1.7;
}
details.vn .vn-body p{margin:8px 0}
details.vn .vn-body ul,details.vn .vn-body ol{margin:8px 0;padding-left:22px}
details.vn .vn-body li{margin:5px 0}

.mistake-box{
  background:var(--amberbg);border-left:5px solid var(--amberline);
  border-radius:10px;padding:12px 16px;margin:10px 0;
  font-size:14.5px;line-height:1.65;
}
.mistake-box h4{
  margin:0 0 6px;font-size:13px;font-weight:800;
  color:var(--amber);letter-spacing:.04em;text-transform:uppercase;
}
.mistake-box ul{margin:6px 0;padding-left:20px}
.mistake-box li{margin:5px 0}

.check-box{
  background:#f6fbff;border:1px dashed var(--blue-l);
  border-radius:12px;padding:14px 16px;margin:14px 0;
}
.check-box .check-title{
  font-size:12px;font-weight:800;color:var(--blue);
  letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;
}
.check-box .check-q{
  font-size:15px;font-weight:600;color:var(--navy);
  margin:0 0 10px;line-height:1.55;
}
.check-opts{display:flex;flex-direction:column;gap:7px}
.check-opt{
  display:flex;gap:10px;align-items:center;
  background:#fff;border:2px solid var(--line);
  border-radius:10px;padding:10px 14px;
  font-size:14.5px;text-align:left;color:var(--ink);
  cursor:pointer;transition:.15s;
}
.check-opt:hover{border-color:var(--blue-l);background:#f9fcff}
.check-opt.sel{border-color:var(--blue);background:#e7f1fc}
.check-opt.ok{border-color:var(--ok);background:var(--okbg)}
.check-opt.bad{border-color:var(--bad);background:var(--badbg)}
.check-opt .letter{
  font-weight:800;color:var(--blue);
  width:22px;flex:0 0 auto;
}
.check-feedback{
  margin-top:10px;padding:10px 14px;border-radius:8px;
  font-size:14px;line-height:1.6;font-weight:600;
}
.check-feedback.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--okline)}
.check-feedback.bad{background:var(--badbg);color:var(--bad);border:1px solid var(--badline)}

.structure-chips{
  display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;
}
.struct-chip{
  padding:8px 14px;border-radius:999px;
  background:#fff;border:1.5px solid var(--blue-l);
  color:var(--navy);font-size:13.5px;font-weight:800;
  cursor:pointer;transition:.15s;
}
.struct-chip:hover{background:var(--pastel)}
.struct-chip.open{background:var(--navy);color:#fff;border-color:var(--navy)}
.struct-card{
  display:none;
  background:#fff;border:1px solid var(--blue-l);
  border-radius:12px;padding:14px 16px;
  margin:6px 0 14px;font-size:14px;line-height:1.65;
  box-shadow:var(--shadow);
}
.struct-card.open{display:block}
.struct-card h4{
  margin:0 0 8px;font-size:14px;color:var(--navy);font-weight:800;
}
.struct-card .formula{
  display:inline-block;background:var(--pastel);
  color:var(--navy);font-weight:800;padding:6px 12px;
  border-radius:8px;font-size:14px;margin:4px 0 8px;
}
.struct-card ul{margin:6px 0;padding-left:20px}
.struct-card li{margin:4px 0}

.nav-arrows{
  display:flex;gap:10px;justify-content:space-between;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
}
.nav-arrows .btn{flex:1}
@media(min-width:520px){
  .nav-arrows{justify-content:flex-start}
  .nav-arrows .btn{flex:0 0 auto;min-width:130px}
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--navy);
  font-size:14px;font-weight:700;cursor:pointer;
  transition:.15s;
  text-align:center;
}
.btn:hover{background:var(--pastel2);border-color:var(--blue-l)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2);border-color:var(--navy2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--pastel2)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--badline)}
.btn.danger:hover{background:var(--badbg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn.sm{padding:8px 13px;font-size:13px}

/* ============ EXERCISES ============ */
.ex-item{
  padding:12px 0;border-bottom:1px dashed var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;
  font-size:15.5px;line-height:1.65;
}
.ex-item:last-child{border-bottom:none}
.ex-num{font-weight:800;color:var(--blue);min-width:26px;flex:0 0 auto}
.ex-text{flex:1;min-width:0}
.inp{
  font-family:inherit;font-size:15px;font-weight:700;
  padding:6px 10px;border:2px solid var(--line);
  border-radius:8px;background:#fff;color:var(--navy);
  min-width:120px;transition:.15s;
}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,114,173,.15)}
.inp.ok{border-color:var(--ok);background:var(--okbg)}
.inp.bad{border-color:var(--bad);background:var(--badbg)}
.ans-hint{
  color:var(--ok);font-weight:800;font-size:13px;
  margin-left:4px;
}
.bank{
  display:flex;flex-wrap:wrap;gap:7px;
  background:#f6fbff;border:1px dashed var(--blue-l);
  border-radius:10px;padding:10px 12px;margin:10px 0;
}
.bank-title{
  font-size:11px;font-weight:800;color:var(--blue);
  text-transform:uppercase;letter-spacing:.08em;
  width:100%;margin-bottom:4px;
}
.bank-item{
  padding:6px 12px;border-radius:999px;
  background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--navy);
  cursor:pointer;transition:.15s;
}
.bank-item:hover{background:var(--pastel);border-color:var(--blue-l)}

.match{
  display:grid;grid-template-columns:1fr;gap:10px;
}
@media(min-width:640px){
  .match{grid-template-columns:1fr 1fr;gap:16px}
}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-head{
  font-size:11px;font-weight:800;color:var(--blue);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:2px;
}
.match-item{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:2px solid var(--line);
  border-radius:10px;padding:10px 12px;
  font-size:14px;text-align:left;color:var(--ink);
  cursor:pointer;transition:.15s;line-height:1.45;
  font-family:inherit;
}
.match-item:hover{border-color:var(--blue-l);background:#f9fcff}
.match-item.sel{border-color:var(--blue);background:#e7f1fc}
.match-item.paired{border-color:var(--blue-l);background:#f3f9ff}
.match-item.ok{border-color:var(--ok);background:var(--okbg)}
.match-item.bad{border-color:var(--bad);background:var(--badbg)}
.match-item .badge{
  margin-left:auto;background:var(--navy);color:#fff;
  font-weight:800;font-size:11.5px;padding:2px 8px;
  border-radius:999px;flex:0 0 auto;
}

.feedback-bar{
  margin-top:14px;padding:12px 16px;border-radius:10px;
  font-size:14.5px;font-weight:700;line-height:1.55;
}
.feedback-bar.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--okline)}
.feedback-bar.bad{background:var(--badbg);color:var(--bad);border:1px solid var(--badline)}
.feedback-bar.info{background:var(--pastel2);color:var(--navy);border:1px solid var(--line)}

/* ============ MCQ ============ */
.q-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:10px;flex-wrap:wrap;
}
.q-num-badge{
  background:var(--navy);color:#fff;
  font-size:12px;font-weight:800;
  padding:5px 12px;border-radius:999px;
}
.q-progress-text{font-size:12.5px;color:var(--muted);font-weight:600}
.q-text{
  font-size:17px;font-weight:700;color:var(--navy);
  line-height:1.55;margin:4px 0 16px;
}
.q-options{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;
  padding:13px 16px;border-radius:11px;
  background:#fff;border:2px solid var(--line);
  font-size:15.5px;text-align:left;color:var(--ink);
  cursor:pointer;transition:.15s;line-height:1.5;
  font-family:inherit;
}
.opt:hover:not(:disabled){border-color:var(--blue-l);background:#f9fcff}
.opt:disabled{cursor:default}
.opt .ol{
  font-weight:800;color:var(--blue);
  flex:0 0 auto;width:22px;font-size:15.5px;
}
.opt.sel{border-color:var(--blue);background:#e7f1fc}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .ol{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .ol{color:var(--bad)}

.q-explain{
  margin-top:14px;padding:12px 16px;
  background:var(--pastel2);
  border-left:5px solid var(--blue-l);
  border-radius:10px;font-size:14.5px;line-height:1.65;
}
.q-explain b{color:var(--navy)}
.q-explain .label{
  display:block;font-size:11px;font-weight:800;
  letter-spacing:.08em;color:var(--blue);
  text-transform:uppercase;margin-bottom:4px;
}

.test-panel{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:12px;background:#f6fbff;
  border:1px solid var(--line);border-radius:12px;
  margin-bottom:14px;
}
.test-panel-title{
  font-size:11px;font-weight:800;color:var(--blue);
  text-transform:uppercase;letter-spacing:.08em;
  width:100%;margin-bottom:4px;
}
.test-dot{
  width:34px;height:34px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:800;color:var(--navy);
  cursor:pointer;transition:.15s;
  display:flex;align-items:center;justify-content:center;
}
.test-dot:hover{border-color:var(--blue-l);background:var(--pastel2)}
.test-dot.answered{background:var(--pastel);border-color:var(--blue-l)}
.test-dot.current{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ============ RESULT ============ */
.result-hero{
  background:linear-gradient(135deg,#12305c,#255a97);
  color:#fff;border-radius:16px;padding:24px 20px;
  text-align:center;margin-bottom:16px;
}
.result-hero .big{
  font-size:56px;font-weight:800;line-height:1;
}
.result-hero .lbl{font-size:14px;opacity:.9;margin-top:6px}
.result-hero .pct{font-size:15px;font-weight:700;margin-top:10px;opacity:.95}

.review-list{margin-top:8px}
.rev-item{
  padding:12px 0;border-bottom:1px solid var(--line);
  font-size:14px;line-height:1.55;
}
.rev-item:last-child{border-bottom:none}
.rev-item .rev-head{
  display:flex;gap:10px;align-items:baseline;margin-bottom:6px;
}
.rev-item .rn{
  font-weight:800;color:var(--blue);flex:0 0 auto;
  min-width:28px;
}
.rev-item .rq{flex:1;font-weight:600;color:var(--navy)}
.rev-item .rline{
  display:flex;gap:8px;font-size:13.5px;
  margin:3px 0 3px 38px;line-height:1.5;
}
.rev-item .rline .lbl{
  color:var(--muted);font-weight:700;flex:0 0 auto;
  min-width:78px;
}
.rev-item .rline .val{flex:1}
.rev-item .rline.ok .val{color:var(--ok);font-weight:700}
.rev-item .rline.bad .val{color:var(--bad);font-weight:700}
.rev-item .rexp{
  margin:6px 0 0 38px;padding:8px 12px;
  background:var(--pastel2);border-radius:8px;
  font-size:13.5px;line-height:1.55;
}

/* ============ DASHBOARD ============ */
.stats-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;margin-bottom:14px;
}
@media(min-width:600px){
  .stats-grid{grid-template-columns:repeat(4,1fr)}
}
.stat-card{
  background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px;
  text-align:center;box-shadow:var(--shadow);
}
.stat-card .stat-num{
  font-size:24px;font-weight:800;color:var(--navy);
  line-height:1.1;
}

const STORAGE_KEY = 'u27_app_v1';

function defaultState(){
  return {
    screen: 'home',
    lessonSection: 'A',
    exerciseTab: '271',
    lessonDone: {},
    exDone: {
      '271': { completed: false, score: 0, total: 6 },

      '274': { completed: false, score: 0, total: 8 }
    },

      order: [], opts: {}, current: 0,
      chosen: {}, submitted: {}, finished: false
    },
    test: {
      order: [], opts: {}, answers: {}, current: 0,
      submitted: false, score: null, attempts: []
    }
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    return {
      ...d, ...s,
      lessonDone: {...d.lessonDone, ...(s.lessonDone||{})},
      exDone: {...d.exDone, ...(s.exDone||{})},
      qStats: {...d.qStats, ...(s.qStats||{})},
      practice: {...d.practice, ...(s.practice||{})},
      test: {...d.test, ...(s.test||{})}
    };
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ------------------------------------------------------------
   5. UTILITIES
   ------------------------------------------------------------ */
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/\.$/,'')
    .replace(/could not/g, "couldn't")
    .replace(/couldnt/g, "couldn't")
    .replace(/cannot/g, "can't");
}
function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
}

/* ------------------------------------------------------------
   6. STATS / PROGRESS
   ------------------------------------------------------------ */
function computeProgress(){
  const totalLesson = LESSON.length;
  const doneLesson = LESSON.filter(l => state.lessonDone[l.id]).length;

  const totalEx = 4;
  const doneEx = ['271','272','273','274'].filter(k => state.exDone[k].completed).length;

  const qKeys = Object.keys(state.qStats);
  let attempted = 0, correct = 0, wrong = 0;
  qKeys.forEach(k => {
    const s = state.qStats[k];
    attempted += 1;
    if(s.lastResult === 'correct') correct++;
    else if(s.lastResult === 'wrong') wrong++;
  });
  let totalAttempts = 0, totalCorrectAttempts = 0;
  qKeys.forEach(k => {
    totalAttempts += state.qStats[k].attempts || 0;
    totalCorrectAttempts += (state.qStats[k].correct || 0);
  });

  const lessonPct = totalLesson ? Math.round(doneLesson/totalLesson*100) : 0;
  const exPct = Math.round(doneEx/totalEx*100);
  const questionsPct = Math.round((attempted/QUESTIONS.length)*100);
  const overall = Math.round((lessonPct + exPct + questionsPct)/3);

  return {
    lessonPct, exPct, questionsPct, overall,
    doneLesson, totalLesson,
    doneEx, totalEx,
    attemptedQuestions: attempted, totalQuestions: QUESTIONS.length,
    correctQuestions: correct, wrongQuestions: wrong,
    totalAttempts, totalCorrectAttempts
  };
}
function mistakesList(){
  const arr = [];
  Object.keys(state.qStats).forEach(k => {
    if(state.qStats[k].lastResult === 'wrong') arr.push(parseInt(k,10));
  });
  return arr.sort((a,b)=>a-b);
}

/* ---- Exercise checking ---- */
const matchState = { sel:null, pairs:{} };

function updateMatchUI(){
  app.querySelectorAll('.match-item').forEach(el => {
    const side = el.dataset.m;
    const id = el.dataset.id;
    const badge = el.querySelector('.badge');
    el.classList.remove('sel','paired');
    badge.style.display = 'none';
    badge.textContent = '';
    if(side === 'L'){
      if(matchState.sel === id) el.classList.add('sel');
      if(matchState.pairs[id]){
        el.classList.add('paired');
        badge.textContent = matchState.pairs[id];
        badge.style.display = '';
      }
    }else{
      let owner = null;
      for(const k in matchState.pairs){
        if(matchState.pairs[k] === id){ owner = k; break; }
      }
      if(owner){
        el.classList.add('paired');
        badge.textContent = owner;
        badge.style.display = '';
      }
    }
  });
}

function checkEx271(){
  const fb = document.getElementById('ex271-fb');
  let correct = 0;
  app.querySelectorAll('.match-item[data-m="L"]').forEach(el => {
    const id = el.dataset.id;
    const key = EX_271.pairs.find(p => p.id === id).right;
    const ok = (matchState.pairs[id] === key);
    el.classList.remove('ok','bad');
    el.classList.add(ok ? 'ok' : 'bad');
    if(ok) correct++;
  });
  app.querySelectorAll('.match-item[data-m="R"]').forEach(el => el.classList.remove('ok','bad'));
  fb.style.display = '';
  fb.className = 'feedback-bar ' + (correct === 6 ? 'ok' : 'bad');
  fb.innerHTML = 'Bạn nối đúng <b>' + correct + '/6</b> cặp. ' +
    (correct === 6 ? 'Tuyệt vời!' : 'Hãy xem lại các cặp bị đánh dấu đỏ.');
  state.exDone['271'] = { completed: true, score: correct, total: 6 };
  saveState();
  renderHeaderProgress();
}

function checkFillEx(k, container, answers, total){
  if(!container) return;
  let correct = 0;
  container.querySelectorAll('.inp').forEach(inp => {
    const i = parseInt(inp.dataset['ex'+k+'Inp'], 10);
    const ans = answers[i];
    const hint = container.querySelector('[data-ex'+k+'-hint="'+i+'"]');
    inp.classList.remove('ok','bad');
    if(normalize(inp.value) === normalize(ans)){
      inp.classList.add('ok');
      if(hint){ hint.textContent = ''; hint.style.display = 'none'; }
      correct++;
    }else{
      inp.classList.add('bad');
      if(hint){ hint.textContent = '→ ' + ans; hint.style.display = ''; }
    }
  });
  const fb = document.getElementById('ex'+k+'-fb');
  if(fb){
    fb.style.display = '';
    fb.className = 'feedback-bar ' + (correct === total ? 'ok' : 'bad');
    fb.innerHTML = 'Bạn đúng <b>' + correct + '/' + total + '</b>. ' +
      (correct === total ? 'Hoàn hảo!' : 'Những ô màu đỏ là câu chưa đúng — đáp án đúng hiển thị bên cạnh.');
  }
  state.exDone[k] = { completed: true, score: correct, total: total };
  saveState();
  renderHeaderProgress();
}

      cls += ' sel';
    }
    return '<button class="' + cls + '" data-practice-opt="' + oi + '"' + (submitted ? ' disabled' : '') + '>' +
             '<span class="ol">' + letters[p] + '</span>' +
             '<span class="ot">' + escapeHTML(q.opts[oi]) + '</span>' +
           '</button>';
  }).join('');

  const explain = submitted
    ? '<div class="q-explain"><span class="label">Giải thích</span>' + q.ex + '</div>'
    : '';

  const checkBtn = submitted
    ? '<button class="btn" disabled>Đã kiểm tra</button>'
    : '<button class="btn primary" data-practice-check' + (chosen === undefined ? ' disabled' : '') + '>Kiểm tra</button>';

  const prevDisabled = pos === 0 ? 'disabled' : '';
  const nextDisabled = pos === state.practice.order.length - 1 ? 'disabled' : '';
  const nextLabel = submitted ? 'Câu tiếp theo ›' : 'Bỏ qua ›';

    <h1 class="screen-title">Practice — 30 câu</h1>

      </div>
      <p class="q-text">${escapeHTML(q.q)}</p>
      <div class="q-options">${optsHTML}</div>
      ${explain}
      <div class="btn-row" style="justify-content:space-between;margin-top:16px">
        <button class="btn" data-practice-nav="-1" ${prevDisabled}>‹ Câu trước</button>
        <button class="btn ghost" data-practice-finish>Kết thúc</button>
        <button class="btn primary" data-practice-nav="1" ${nextDisabled}>${nextLabel}</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        ${checkBtn}
      </div>
    </div>
  `;
}

function renderPracticeSummary(){
  const total = state.practice.order.length;
  let correct = 0, wrong = 0, skipped = 0;
  state.practice.order.forEach(qi => {
    if(state.practice.submitted[qi]){
      if(state.practice.chosen[qi] === QUESTIONS[qi].a) correct++;
      else wrong++;
    }else{
      skipped++;
    }
  });
  const pct = total ? Math.round(correct/total*100) : 0;

  app.innerHTML = `
    <h1 class="screen-title">Kết quả luyện tập</h1>
    <p class="screen-sub">Bạn đã hoàn thành phiên luyện tập ${total} câu.</p>
    <div class="result-hero">
      <div class="big">${correct}/${total}</div>
      <div class="lbl">Số câu trả lời đúng</div>
      <div class="pct">${pct}% chính xác · Sai: ${wrong} · Bỏ qua: ${skipped}</div>
    </div>
    <div class="btn-row">
      <button class="btn primary" data-practice-start>Làm lại (xáo trộn)</button>
      <button class="btn" data-go="review">Xem lại câu sai</button>
      <button class="btn" data-go="home">Về trang chủ</button>
    </div>
  `;
}

function updateQStats(qi, correct){
  if(!state.qStats[qi]) state.qStats[qi] = {attempts:0, correct:0, lastResult:null};
  state.qStats[qi].attempts += 1;
  if(correct) state.qStats[qi].correct += 1;
  state.qStats[qi].lastResult = correct ? 'correct' : 'wrong';
  saveState();
  renderHeaderProgress();
}

      <div class="card">
        <h2>📝 Hướng dẫn</h2>
        <ul>
          <li>Di chuyển giữa các câu bằng nút <b>Previous / Next</b> hoặc bảng điều hướng câu hỏi.</li>
          <li>Câu đã trả lời sẽ được đánh dấu trong bảng điều hướng.</li>
          <li>Nhấn <b>Nộp bài</b> khi hoàn thành. Đáp án và giải thích chỉ hiện sau khi nộp.</li>
          <li>Có thể <b>làm lại</b> — câu hỏi và đáp án sẽ được xáo trộn.</li>
        </ul>
        <div class="btn-row">
          <button class="btn primary" data-test-start>Bắt đầu làm bài</button>
          <button class="btn" data-go="practice">Sang chế độ luyện tập</button>
        </div>
      </div>`;
    return;
  }

  const pos = state.test.current;
  const qi = state.test.order[pos];
  const q = QUESTIONS[qi];
  const order = state.test.opts[qi] || [0,1,2,3];
  const chosen = state.test.answers[qi];
  const letters = ['A','B','C','D'];
  const total = state.test.order.length;
  const answeredCount = Object.keys(state.test.answers).length;

  const optsHTML = order.map((oi, p) => {
    let cls = 'opt';
    if(oi === chosen) cls += ' sel';
    return '<button class="' + cls + '" data-test-opt="' + oi + '">' +
             '<span class="ol">' + letters[p] + '</span>' +
             '<span class="ot">' + escapeHTML(q.opts[oi]) + '</span>' +
           '</button>';
  }).join('');

  const navDots = state.test.order.map((qIdx, i) => {
    const answered = state.test.answers[qIdx] !== undefined;
    const cur = i === pos;
    return '<button class="test-dot' + (answered?' answered':'') + (cur?' current':'') + '" data-test-jump="' + i + '">' + (i+1) + '</button>';
  }).join('');

  const prevDisabled = pos === 0 ? 'disabled' : '';

  app.innerHTML = `
    <h1 class="screen-title">Test Mode — 30 câu</h1>
    <p class="screen-sub">Đã trả lời ${answeredCount}/${total} câu. Đáp án chỉ hiện sau khi nộp bài.</p>

    <div class="test-panel">
      <span class="test-panel-title">Điều hướng câu hỏi</span>
      ${navDots}
    </div>

    <div class="card">
      <div class="q-head">
        <span class="q-num-badge">Câu ${pos+1} / ${total}</span>
        <span class="q-progress-text">Q${qi+1}</span>
      </div>
      <p class="q-text">${escapeHTML(q.q)}</p>
      <div class="q-options">${optsHTML}</div>
      <div class="btn-row" style="justify-content:space-between;margin-top:16px">
        <button class="btn" data-test-nav="-1" ${prevDisabled}>‹ Previous</button>
        <button class="btn" data-test-nav="1">Next ›</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn primary" data-test-submit>Nộp bài (Submit Test)</button>
        <button class="btn danger" data-test-cancel>Hủy bài làm</button>
      </div>
    </div>
  `;
}

function renderTestResult(){
  const total = state.test.order.length;
  let correct = 0;
  state.test.order.forEach(qi => {
    if(state.test.answers[qi] === QUESTIONS[qi].a) correct++;
  });
  const pct = total ? Math.round(correct/total*100) : 0;
  const letters = ['A','B','C','D'];

  const review = state.test.order.map((qi, i) => {
    const q = QUESTIONS[qi];
    const userIdx = state.test.answers[qi];
    const ok = userIdx === q.a;
    const userTxt = userIdx === undefined ? 'Bạn chưa trả lời.' : letters[userIdx] + '. ' + q.opts[userIdx];
    const rightTxt = letters[q.a] + '. ' + q.opts[q.a];
    return '<div class="rev-item">' +
      '<div class="rev-head">' +
        '<span class="rn">' + (i+1) + '</span>' +
        '<span class="rq">' + escapeHTML(q.q) + '</span>' +
        '<span class="rmark" style="color:' + (ok?'var(--ok)':'var(--bad)') + ';font-weight:800">' + (ok?'✓':'✗') + '</span>' +
      '</div>' +
      '<div class="rline ' + (ok?'ok':'bad') + '"><span class="lbl">Bạn chọn:</span><span class="val">' + escapeHTML(userTxt) + '</span></div>' +
      (ok ? '' : '<div class="rline ok"><span class="lbl">Đáp án đúng:</span><span class="val">' + escapeHTML(rightTxt) + '</span></div>') +
      '<div class="rexp"><b>Giải thích:</b> ' + q.ex + '</div>' +
    '</div>';
  }).join('');

  app.innerHTML = `
    <h1 class="screen-title">Kết quả bài kiểm tra</h1>
    <p class="screen-sub">Đáp án đúng và giải thích cho từng câu.</p>

    <div class="result-hero">
      <div class="big">${correct}/${total}</div>
      <div class="lbl">Số câu trả lời đúng</div>
      <div class="pct">${pct}% chính xác</div>
    </div>

    <div class="btn-row">
      <button class="btn primary" data-test-retry>Làm lại (xáo trộn)</button>
      <button class="btn" data-go="review">Xem lại câu sai</button>
      <button class="btn" data-go="home">Về trang chủ</button>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Chi tiết từng câu</h2>
      <div class="review-list">${review}</div>
    </div>
  `;
}

/* ------------------------------------------------------------
   16. EVENT HANDLING
   ------------------------------------------------------------ */
document.getElementById('navInner').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]');
  if(b){ go(b.dataset.nav); }
});

app.addEventListener('click', e => {
  const nav = e.target.closest('[data-go]');
  if(nav){ go(nav.dataset.go); return; }

  const ls = e.target.closest('[data-lesson]');
  if(ls){ state.lessonSection = ls.dataset.lesson; saveState(); render(); return; }

  const lnav = e.target.closest('[data-lesson-nav]');
  if(lnav){
    const dir = parseInt(lnav.dataset.lessonNav, 10);
    const i = LESSON.findIndex(l => l.id === state.lessonSection);
    const next = i + dir;
    if(next >= 0 && next < LESSON.length){
      state.lessonSection = LESSON[next].id;
      saveState();
      render();
    }
    return;
  }

  const chip = e.target.closest('[data-struct]');
  if(chip){
    const id = chip.dataset.struct;
    const card = document.getElementById('struct-' + id);
    if(card){
      card.classList.toggle('open');
      chip.classList.toggle('open');
    }
    return;
  }

  const checkOpt = e.target.closest('[data-check-opt]');
  if(checkOpt){
    const box = checkOpt.closest('[data-check]');
    const secId = box.dataset.check;
    const sec = LESSON.find(l => l.id === secId);
    const i = parseInt(checkOpt.dataset.checkOpt, 10);
    const fb = document.getElementById('check-fb-' + secId);
    box.querySelectorAll('.check-opt').forEach((el, idx) => {
      el.classList.remove('ok','bad','sel');
      if(idx === sec.check.a) el.classList.add('ok');
      else if(idx === i) el.classList.add('bad');
    });
    fb.style.display = '';
    if(i === sec.check.a){
      fb.className = 'check-feedback ok';
      fb.innerHTML = '✓ Chính xác! ' + sec.check.ex;
      state.lessonDone[secId] = true;
      saveState();
      renderHeaderProgress();
    }else{
      fb.className = 'check-feedback bad';
      fb.innerHTML = '✗ Chưa đúng. ' + sec.check.ex;
    }
    return;
  }

  const ext = e.target.closest('[data-ex]');
  if(ext){ state.exerciseTab = ext.dataset.ex; saveState(); render(); return; }

  const m = e.target.closest('.match-item');
  if(m){
    const side = m.dataset.m;
    const id = m.dataset.id;
    if(side === 'L'){
      if(matchState.pairs[id]){
        delete matchState.pairs[id];
        matchState.sel = null;
      }else{
        matchState.sel = (matchState.sel === id) ? null : id;
      }
    }else{
      if(matchState.sel){
        for(const k in matchState.pairs){
          if(matchState.pairs[k] === id) delete matchState.pairs[k];
        }
        matchState.pairs[matchState.sel] = id;
        matchState.sel = null;
      }
    }
    updateMatchUI();
    return;
  }
  if(e.target.closest('[data-ex271-check]')){ checkEx271(); return; }
  if(e.target.closest('[data-ex271-reset]')){
    matchState.sel = null; matchState.pairs = {};
    renderEx271._order = null;
    render();
    return;
  }

  const bank = e.target.closest('.bank-item');
  if(bank){
    const fill = bank.dataset.fill;
    const word = bank.dataset.word;
    const container = document.getElementById('ex' + fill);
    if(container){
      const empties = Array.from(container.querySelectorAll('.inp')).filter(i => i.value.trim() === '');
      const inp = empties[0] || container.querySelector('.inp:focus');
      if(inp){
        inp.value = word;
        inp.focus();
      }
    }
    return;
  }

  if(e.target.closest('[data-ex272-check]')){
    checkFillEx('272', document.getElementById('ex272'), EX_272.items.map(x=>x.a), 10);
    return;
  }
  if(e.target.closest('[data-ex272-reset]')){
    const c = document.getElementById('ex272');
    if(c){
      c.querySelectorAll('.inp').forEach(i => { i.value=''; i.classList.remove('ok','bad'); });
      c.querySelectorAll('.ans-hint').forEach(h => { h.style.display='none'; h.textContent=''; });
    }
    const fb = document.getElementById('ex272-fb'); if(fb) fb.style.display='none';
    return;
  }
  if(e.target.closest('[data-ex273-check]')){
    checkFillEx('273', document.getElementById('ex273'), EX_273.items.map(x=>x.a), 8);
    return;
  }
  if(e.target.closest('[data-ex273-reset]')){
    const c = document.getElementById('ex273');
    if(c){
      c.querySelectorAll('.inp').forEach(i => { i.value=''; i.classList.remove('ok','bad'); });
      c.querySelectorAll('.ans-hint').forEach(h => { h.style.display='none'; h.textContent=''; });
    }
    const fb = document.getElementById('ex273-fb'); if(fb) fb.style.display='none';
    return;
  }
  if(e.target.closest('[data-ex274-check]')){
    checkFillEx('274', document.getElementById('ex274'), EX_274.items.map(x=>x.a), 8);
    return;
  }
  if(e.target.closest('[data-ex274-reset]')){
    const c = document.getElementById('ex274');
    if(c){
      c.querySelectorAll('.inp').forEach(i => { i.value=''; i.classList.remove('ok','bad'); });
      c.querySelectorAll('.ans-hint').forEach(h => { h.style.display='none'; h.textContent=''; });
    }
    const fb = document.getElementById('ex274-fb'); if(fb) fb.style.display='none';
    return;
  }

  if(e.target.closest('[data-practice-start]')){
    startFullPractice();
    render();
    return;
  }
  const pOpt = e.target.closest('[data-practice-opt]');
  if(pOpt && !pOpt.disabled){
    const oi = parseInt(pOpt.dataset.practiceOpt, 10);
    const qi = state.practice.order[state.practice.current];
    state.practice.chosen[qi] = oi;
    saveState();
    render();
    return;
  }
  if(e.target.closest('[data-practice-check]')){
    const qi = state.practice.order[state.practice.current];
    const chosen = state.practice.chosen[qi];
    if(chosen === undefined){ toast('Hãy chọn một đáp án trước.'); return; }
    state.practice.submitted[qi] = true;
    const correct = (chosen === QUESTIONS[qi].a);
    updateQStats(qi, correct);
    saveState();
    render();
    return;
  }
  const pnav = e.target.closest('[data-practice-nav]');
  if(pnav){
    const dir = parseInt(pnav.dataset.practiceNav, 10);
    const next = state.practice.current + dir;
    if(next >= 0 && next < state.practice.order.length){
      state.practice.current = next;
      saveState();
      render();
    }
    return;
  }
  if(e.target.closest('[data-practice-finish]')){
    state.practice.finished = true;
    saveState();
    render();
    return;
  }

  if(e.target.closest('[data-test-start]')){
    startTest();
    render();
    return;
  }
  const tOpt = e.target.closest('[data-test-opt]');
  if(tOpt){
    const oi = parseInt(tOpt.dataset.testOpt, 10);
    const qi = state.test.order[state.test.current];
    if(state.test.answers[qi] === oi) delete state.test.answers[qi];
    else state.test.answers[qi] = oi;
    saveState();
    render();
    return;
  }
  const tnav = e.target.closest('[data-test-nav]');
  if(tnav){
    const dir = parseInt(tnav.dataset.testNav, 10);
    const next = state.test.current + dir;
    if(next >= 0 && next < state.test.order.length){
      state.test.current = next;
      saveState();
      render();
    }
    return;
  }
  const tjump = e.target.closest('[data-test-jump]');
  if(tjump){
    state.test.current = parseInt(tjump.dataset.testJump, 10);
    saveState();
    render();
    return;
  }
  if(e.target.closest('[data-test-submit]')){
    const answered = Object.keys(state.test.answers).length;
    const total = state.test.order.length;
    if(answered < total){
      if(!confirm('Bạn chưa trả lời ' + (total-answered) + ' câu. Vẫn nộp bài?')) return;
    }
    state.test.submitted = true;
    let correct = 0;
    state.test.order.forEach(qi => {
      const ok = state.test.answers[qi] === QUESTIONS[qi].a;
      if(ok) correct++;
      updateQStats(qi, ok);
    });
    state.test.score = correct;
    state.test.attempts = (state.test.attempts || []).concat([{
      date: new Date().toLocaleString('vi-VN'),
      score: correct,
      total: total
    }]);
    saveState();
    render();
    return;
  }
  if(e.target.closest('[data-test-cancel]')){
    if(!confirm('Hủy bài làm hiện tại? Tiến độ bài kiểm tra sẽ bị xóa.')) return;
    state.test = {
      order: [], opts: {}, answers: {}, current: 0,
      submitted: false, score: null,
      attempts: state.test.attempts || []
    };
    saveState();
    render();
    return;
  }
  if(e.target.closest('[data-test-retry]')){
    startTest();
    render();
    return;
  }

  if(e.target.closest('[data-review-practice]')){
    const list = mistakesList();
    if(!list.length){ toast('Không có câu nào để luyện.'); return; }
    startPracticeSession(list);
    state.screen = 'practice';
    saveState();
    renderNav();
    render();
    return;
  }

  if(e.target.closest('[data-reset]')){
    openModal(
      '<h3>Đặt lại toàn bộ tiến độ?</h3>' +
      '<p>Toàn bộ tiến độ học tập, câu trả lời, điểm số và câu cần ôn sẽ bị xóa vĩnh viễn. Bạn có chắc chắn?</p>' +
      '<div class="modal-btns">' +
        '<button class="btn" data-modal-close>Hủy</button>' +
        '<button class="btn danger" data-modal-confirm-reset>Xóa tất cả</button>' +
      '</div>'
    );
    return;
  }
});

/* Modal buttons */
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if(e.target.id === 'modalBackdrop'){ closeModal(); return; }
  if(e.target.closest('[data-modal-close]')){ closeModal(); return; }
  if(e.target.closest('[data-modal-confirm-reset]')){
    state = defaultState();
    saveState();
    closeModal();
    renderNav();
    render();
    toast('Đã đặt lại toàn bộ tiến độ.');
    return;
  }
});

/* Keyboard: Escape closes modal */
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'Escape') closeModal();
});

/* ------------------------------------------------------------
   17. INIT
   ------------------------------------------------------------ */
(function init(){
  renderNav();
  render();
})();
</script>
</body>
</html>
